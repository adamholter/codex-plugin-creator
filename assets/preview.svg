    <text x="156" y="394" font-family="Menlo, Monaco, Consolas, 'Fira Code', monospace" font-size="24" fill="#111">python3 scripts/create_basic_plugin.py</text>
    <text x="156" y="432" font-family="Menlo, Monaco, Consolas, 'Fira Code', monospace" font-size="24" fill="#111">  demo-plugin --with-skills --with-assets</text>
    <text x="156" y="470" font-family="Menlo, Monaco, Consolas, 'Fira Code', monospace" font-size="24" fill="#111">  --with-scripts --with-marketplace</text>
    <text x="136" y="570" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif" font-size="30" fill="#111">What it creates</text>
    <text x="156" y="618" font-family="Menlo, Monaco, Consolas, 'Fira Code', monospace" font-size="25" fill="#111">~/plugins/demo-plugin/</text>
    <text x="184" y="654" font-family="Menlo, Monaco, Consolas, 'Fira Code', monospace" font-size="25" fill="#111">.codex-plugin/plugin.json</text>
    <text x="184" y="690" font-family="Menlo, Monaco, Consolas, 'Fira Code', monospace" font-size="25" fill="#111">skills/</text>
    <text x="184" y="726" font-family="Menlo, Monaco, Consolas, 'Fira Code', monospace" font-size="25" fill="#111">scripts/</text>
    <text x="184" y="762" font-family="Menlo, Monaco, Consolas, 'Fira Code', monospace" font-size="25" fill="#111">assets/</text>
