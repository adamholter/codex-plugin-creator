<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <rect width="1600" height="900" fill="#f6f6f3"/>
  <g stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M44 52C361 34 709 40 1027 41C1232 42 1390 43 1554 57"/>
    <path d="M42 847C384 866 711 862 1045 855C1247 850 1397 842 1548 824"/>
    <path d="M47 59C32 286 31 578 52 846"/>
    <path d="M1550 58C1567 294 1565 584 1543 821"/>
  </g>

  <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif" fill="#111">
    <text x="94" y="118" font-size="54" font-weight="700">Codex Plugin Creator</text>
    <text x="96" y="168" font-size="28">Scaffold -> validate -> reload local plugins without silent failures</text>
  </g>

  <g stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="#fff">
    <path d="M94 240C280 229 461 231 650 236C657 237 663 243 665 252C671 403 671 553 664 704C663 715 654 722 645 723C462 728 283 727 101 718C92 716 85 709 84 700C77 550 78 401 87 251C88 246 91 242 94 240Z"/>
    <path d="M739 241C962 228 1170 230 1493 240C1500 241 1506 246 1508 255C1513 402 1513 550 1508 698C1506 711 1498 717 1487 719C1270 725 1057 726 747 719C738 718 732 711 731 702C724 555 724 405 730 257C731 249 734 244 739 241Z"/>
  </g>

  <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif" fill="#111">
    <text x="126" y="302" font-size="30" font-weight="700">1. Scaffold the right shape</text>
    <text x="770" y="302" font-size="30" font-weight="700">2. Validate the contract</text>
  </g>

  <g fill="#111" font-family="Menlo, Monaco, Consolas, 'Fira Code', monospace">
    <text x="128" y="360" font-size="22">python3 scripts/create_basic_plugin.py</text>
    <text x="128" y="394" font-size="22">  demo-plugin --path "$HOME/plugins"</text>
    <text x="128" y="428" font-size="22">  --with-skills --with-assets</text>
    <text x="128" y="462" font-size="22">  --with-scripts --with-marketplace</text>

    <text x="128" y="538" font-size="22">~/plugins/demo-plugin/</text>
    <text x="160" y="572" font-size="22">.codex-plugin/plugin.json</text>
    <text x="160" y="606" font-size="22">skills/</text>
    <text x="160" y="640" font-size="22">scripts/</text>
    <text x="160" y="674" font-size="22">assets/</text>

    <text x="772" y="360" font-size="22">python3 scripts/validate_plugin.py</text>
    <text x="772" y="394" font-size="22">  "$HOME/plugins/demo-plugin"</text>
  </g>

  <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif" fill="#111">
    <text x="772" y="460" font-size="24">Checks for:</text>
    <text x="804" y="506" font-size="22">missing .codex-plugin/plugin.json</text>
    <text x="804" y="544" font-size="22">invalid JSON or bad semver</text>
    <text x="804" y="582" font-size="22">unsupported manifest fields</text>
    <text x="804" y="620" font-size="22">broken asset paths</text>
    <text x="804" y="658" font-size="22">leftover [TODO: ...] placeholders</text>
  </g>

  <g stroke="#111" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M676 430C714 426 733 425 756 424"/>
    <path d="M744 411L778 424L743 440"/>
  </g>

  <g stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="#fff">
    <path d="M95 720C315 708 538 710 760 717C769 718 775 724 776 733C780 769 780 804 776 839C775 847 769 852 761 853C542 860 321 860 103 852C94 851 87 845 86 837C81 802 82 767 88 730C89 725 91 722 95 720Z"/>
  </g>

  <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif" fill="#111">
    <text x="118" y="770" font-size="28" font-weight="700">3. Reload the local plugin cleanly</text>
  </g>
  <g fill="#111" font-family="Menlo, Monaco, Consolas, 'Fira Code', monospace">
    <text x="120" y="809" font-size="21">python3 scripts/update_plugin_cachebuster.py "$HOME/plugins/demo-plugin"</text>
    <text x="120" y="838" font-size="20">python3 scripts/read_marketplace_name.py &amp;&amp; codex plugin add demo-plugin@personal</text>
  </g>
</svg>
