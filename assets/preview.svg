    <rect x="812" y="346" width="646" height="164" rx="18" fill="#f0f0f0" stroke="#111" stroke-width="4"/>
    <text x="838" y="394" font-family="Menlo, Monaco, Consolas, 'Fira Code', monospace" font-size="23" fill="#111">~/.agents/plugins/marketplace.json</text>
    <text x="838" y="432" font-family="Menlo, Monaco, Consolas, 'Fira Code', monospace" font-size="23" fill="#111">{</text>
    <text x="864" y="466" font-family="Menlo, Monaco, Consolas, 'Fira Code', monospace" font-size="23" fill="#111">"name": "demo-plugin",</text>
    <text x="864" y="500" font-family="Menlo, Monaco, Consolas, 'Fira Code', monospace" font-size="23" fill="#111">"path": "./plugins/demo-plugin"</text>
